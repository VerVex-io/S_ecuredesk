; Hardening for SecureDesk (loaded after php.ini-production)
; CVE-2026-109618 / CVE-2026-109619: stopgap only, the real fix is PHP >= 8.3.36
session.upload_progress.enabled = 0
expose_php = 0
display_errors = 0
display_startup_errors = 0
log_errors = 1
; API only accepts small JSON bodies
post_max_size = 1M
upload_max_filesize = 1M
max_file_uploads = 1
; Sessions
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.sid_length = 48
